<!--
  HUD superiore compatto: collezione (con mini progress) + livello/punti.
  Una sola striscia in alto, niente saluto ingombrante. Le aree vuote non
  intercettano i gesti della mappa (pointer-events gestiti nello .scss).
-->
<header class="home-hud" aria-label="Stato esplorazione">
  <!-- Collezione + progress -->
  <div class="home-hud__chip home-hud__chip--collection">
    <span class="home-hud__icon" aria-hidden="true">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="7" height="7" rx="1.5"/>
        <rect x="14" y="3" width="7" height="7" rx="1.5"/>
        <rect x="3" y="14" width="7" height="7" rx="1.5"/>
        <rect x="14" y="14" width="7" height="7" rx="1.5"/>
      </svg>
    </span>
    <div class="home-hud__col">
      <div class="home-hud__line">
        <span class="home-hud__count">
          @if (loading() && total() === 0) {
            <span class="home-hud__skeleton">—/—</span>
          } @else {
            <strong>{{ discovered() }}</strong>/{{ total() }}
          }
        </span>
        <span class="home-hud__tag">collezione</span>
      </div>
      <div
        class="home-hud__bar"
        role="progressbar"
        [attr.aria-valuenow]="progressPercent()"
        aria-valuemin="0"
        aria-valuemax="100"
        [attr.aria-label]="'Collezione completata al ' + progressPercent() + ' percento'"
      >
        <div class="home-hud__bar-fill" [style.width.%]="progressPercent()"></div>
      </div>
    </div>
  </div>

  <!-- Livello + punti -->
  <div class="home-hud__chip home-hud__chip--level">
    <span class="home-hud__lvl">Lv {{ level() }}</span>
    <span class="home-hud__pts">
      {{ points() | number: '1.0-0' }}<span class="home-hud__pts-unit">pt</span>
    </span>
  </div>
</header>
