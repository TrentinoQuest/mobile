<!-- HUD identità giocatore: floating card con avatar, livello, streak e monete. -->
<div class="hud">
  <!-- Identità: colonna avatar+livello + username → naviga al profilo -->
  <button class="hud__identity" (click)="openProfile()" aria-label="Vai al profilo">
    <div class="hud__avatar-col">
      <div class="hud__ring-wrap" aria-hidden="true">
        <svg class="hud__ring-svg" viewBox="0 0 50 50" fill="none">
          <circle class="hud__ring-bg" cx="25" cy="25" r="23" />
          <circle
            class="hud__ring-fill"
            cx="25"
            cy="25"
            r="23"
            [style.stroke-dasharray]="ringCircumference"
            [style.stroke-dashoffset]="xpRingOffset()"
          />
        </svg>
        <div class="hud__avatar">{{ (username() || '?').charAt(0).toUpperCase() }}</div>
      </div>
      <span class="hud__level">Lv.{{ level() }}</span>
    </div>
    <span class="hud__username">{{ username() }}</span>
  </button>

  <div class="hud__spacer"></div>

  <!-- Streak → modale dettaglio -->
  <button
    class="hud__chip hud__chip--streak"
    [class.hud__chip--streak-active]="currentStreak() > 0"
    (click)="openStreakDetail()"
    aria-label="Streak {{ currentStreak() }} giorni"
  >
    <ion-icon name="flame" aria-hidden="true"></ion-icon>
    <span class="hud__chip-value">{{ currentStreak() }}</span>
  </button>

  <!-- Monete: moneta circolare dorata -->
  <div class="hud__chip hud__chip--coins" aria-label="{{ coins() }} monete">
    <svg class="hud__gem" width="20" height="20" viewBox="0 0 20 20" aria-hidden="true">
      <circle cx="10" cy="10" r="9" fill="currentColor" />
      <circle cx="10" cy="10" r="6" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.2" />
      <circle cx="10" cy="10" r="2.5" fill="rgba(255,255,255,0.55)" />
    </svg>
    <span class="hud__chip-value">{{ coins() }}</span>
  </div>
</div>
