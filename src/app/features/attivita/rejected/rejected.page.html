<ion-content class="rejected-page" fullscreen>
  <div class="rejected-page__container">
    <div class="rejected-page__icon-wrap">
      <ion-icon name="close-circle-outline" class="rejected-page__icon"></ion-icon>
    </div>

    <h1 class="rejected-page__title">Registrazione non approvata</h1>

    <p class="rejected-page__body">
      La tua richiesta di registrazione è stata esaminata e non ha superato
      la verifica. Se ritieni ci sia stato un errore, contatta il supporto
      di Trentino Quest.
    </p>

    <p class="rejected-page__contact">
      support&#64;trentinoquest.it
    </p>

    <div class="rejected-page__logout-wrap">
      <tq-button variant="secondary" iconStart="log-out-outline" (tapped)="logout()">
        Esci dall'account
      </tq-button>
    </div>
  </div>
</ion-content>
