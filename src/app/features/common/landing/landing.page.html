<!--
  Landing immersiva: brand + cosa fa l'app + scelta percorso + login.
  Atmosfera dark con bagliori ocra/forest, coerente col mondo di gioco.
-->
<ion-content [fullscreen]="true" class="landing">
  <!-- Strato atmosferico decorativo (bagliori + griglia tenue). -->
  <div class="landing__bg" aria-hidden="true"></div>

  <div class="landing__inner">
    <!-- ===================== Brand ===================== -->
    <header class="landing__hero">
      <p class="landing__kicker">ESPLORA · SCOPRI · COLLEZIONA</p>
      <h1 class="landing__title">Trentino <em>Quest</em></h1>
      <p class="landing__tagline">
        Scova i QR nascosti tra borghi e sentieri del Trentino e trasforma ogni
        scoperta in un collezionabile.
      </p>
    </header>

    <!-- ===================== Percorsi ===================== -->
    <nav class="landing__paths" aria-label="Scegli come iniziare">
      <!-- Esploratore -->
      <a class="path path--player" routerLink="/giocatore/register">
        <span class="path__icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"/>
            <path d="M15.6 8.4l-2.1 5.1-5.1 2.1 2.1-5.1 5.1-2.1z"/>
          </svg>
        </span>
        <span class="path__text">
          <span class="path__title">Sono un esploratore</span>
          <span class="path__sub">Trova quest e colleziona scoperte</span>
        </span>
        <span class="path__arrow">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 6l6 6-6 6"/>
          </svg>
        </span>
      </a>

      <!-- Attività locale -->
      <a class="path path--business" routerLink="/attivita/register">
        <span class="path__icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 9l1-4h14l1 4M4 9v10h16V9M4 9h16M9 19v-5h6v5"/>
          </svg>
        </span>
        <span class="path__text">
          <span class="path__title">Sono un'attività locale</span>
          <span class="path__sub">Offri sconti agli esploratori</span>
        </span>
        <span class="path__arrow">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 6l6 6-6 6"/>
          </svg>
        </span>
      </a>
    </nav>

    <!-- ===================== Login ===================== -->
    <p class="landing__login">
      Hai già un account?
      <a routerLink="/auth/login" class="landing__login-link">Accedi</a>
    </p>
  </div>
</ion-content>
