<ion-content [fullscreen]="true" class="offline-content">
  <div class="offline-wrapper">
    <ion-icon name="cloud-offline-outline" class="offline-icon" aria-hidden="true"></ion-icon>

    <h1 class="offline-title">Sei offline</h1>

    <p class="offline-message">
      Non riusciamo a contattare il server.<br />
      Controlla la connessione e riprova.
    </p>

    <div class="offline-retry">
      <tq-button [loading]="retrying()" (tapped)="retryNow()"> Riprova </tq-button>
    </div>

    <p class="offline-hint">
      Stiamo controllando automaticamente la connessione ogni pochi secondi.
    </p>
  </div>
</ion-content>
